# Preview for review (plan § 3 / § 4, ADR 0003).
# Runs rig, saves /digest/<night> as one HTML file with curl, and deploys it to GitHub Pages.
# The HTML is never committed. The banner shows the repo variable LANE_MARKER; delete the
# variable and run this again to upload the same page "no marker set" over the same link.
name: preview

on:
  workflow_dispatch:
    inputs:
      night:
        description: Night to preview (YYYY-MM-DD)
        default: '2026-10-28'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable pnpm && pnpm install --frozen-lockfile
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      - name: Save the page
        env:
          LANE_MARKER: ${{ vars.LANE_MARKER }}
          NIGHT: ${{ inputs.night }}
          PORT: '8787'
        run: |
          pnpm start > rig.log 2>&1 &
          for i in $(seq 1 30); do curl -fs localhost:8787/health > /dev/null && break; sleep 1; done
          mkdir -p _site
          curl -fsS "localhost:8787/digest/$NIGHT" -o _site/index.html
          grep -o '<span class="marker">[^<]*</span>' _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
